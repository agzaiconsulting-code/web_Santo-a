name: Keep Supabase DB Alive

on:
  schedule:
    - cron: '0 8 */5 * *'  # cada 5 días a las 8:00 UTC
  workflow_dispatch:        # permite lanzarlo manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://nnulyreebtgpfadqkuae.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 500 ]; then
            echo "Error: unexpected status $STATUS"
            exit 1
          fi
